# Home CCTV hub. Run with: podman compose up -d
# Podman on macOS runs containers in a Linux VM. Outbound traffic to the DVR
# is NATed through the Mac, which usually reaches the LAN. host network mode
# does not attach containers to the Mac's LAN, so it is not used here.
#
# SECURITY MODEL (Phase 2, WRK-01 / WRK-02 / STR-03):
#   * Every image runs as the non-root user cctv (uid/gid 10001); see the
#     Dockerfiles and docs/Container-Hardening.md for the host-side ownership
#     migration. Each container has a read-only root filesystem with tmpfs for
#     scratch space, drops all Linux capabilities, forbids privilege escalation,
#     and has memory/PID limits.
#   * Only the hub keeps `env_file: .env`: it is the one service that genuinely
#     needs the application secret set (SESSION_SECRET, APP_*, DVR_*, Telegram,
#     detection settings). MediaMTX and both workers get an explicit, minimal
#     `environment:` block instead, so a compromised worker or media server
#     cannot read the session signing secret, the Telegram token, the hub login
#     or the DVR password. Compose still reads the project `.env` for the
#     interpolation below.
#   * Network segmentation is NOT part of Phase 2 (Phase 3 owns it); this file
#     intentionally defines no `networks:`.
name: home-cctv

services:
  mediamtx:
    build:
      context: .
      dockerfile: mediamtx/Dockerfile
    # Explicit, minimal environment. MediaMTX renders these into its config at
    # container start. It must never see SESSION_SECRET, TELEGRAM_*, APP_* or
    # the DVR HTTP port. Empty values fall back to the renderer's defaults and
    # fail-closed auth (no password -> no anonymous reads unless the explicit
    # development escape hatch is set).
    environment:
      # DVR RTSP source. The HIKVISION_* names are the documented aliases.
      DVR_HOST: "${DVR_HOST:-}"
      HIKVISION_IP: "${HIKVISION_IP:-}"
      DVR_RTSP_PORT: "${DVR_RTSP_PORT:-}"
      DVR_USERNAME: "${DVR_USERNAME:-}"
      HIKVISION_USERNAME: "${HIKVISION_USERNAME:-}"
      DVR_PASSWORD: "${DVR_PASSWORD:-}"
      HIKVISION_PASSWORD: "${HIKVISION_PASSWORD:-}"
      # Read credential rendered into MediaMTX's internal auth user.
      MEDIAMTX_AUTH_USER: "${MEDIAMTX_AUTH_USER:-}"
      MEDIAMTX_AUTH_PASSWORD: "${MEDIAMTX_AUTH_PASSWORD:-}"
      # Development-only escape hatch; leave unset/false in production.
      MEDIAMTX_ALLOW_ANONYMOUS: "${MEDIAMTX_ALLOW_ANONYMOUS:-}"
      # LAN address advertised in WebRTC ICE candidates.
      WEBRTC_ADDITIONAL_HOST: "${WEBRTC_ADDITIONAL_HOST:-}"
    # Only the WebRTC media port is published in production.
    #
    # The browser talks to the hub for signalling (WHEP) and HLS, and the hub
    # reaches MediaMTX over the compose network. MediaMTX's HLS (8888), WHEP
    # (8889) and API (9997) listeners therefore stay internal. ICE media still
    # needs a reachable UDP/TCP endpoint, so 8189 is the one published port;
    # it only answers ICE for a WebRTC session that the authenticated hub has
    # already created. Never publish 554, 8888, 8889 or 9997 on the LAN.
    # For `npm run dev` on the host, compose.dev.yml adds loopback-only ports.
    ports:
      - "8189:8189/tcp"
      - "8189:8189/udp"
    # entrypoint.sh renders the config to /tmp, so /tmp must be writable even
    # though the image filesystem is read-only. 16m is ample for one small YAML.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # Host is documented as 4 GB. MediaMTX relays four WebRTC/HLS streams with
    # small in-memory buffer queues; 384m covers that plus the Node config
    # renderer. tmpfs pages count against this limit.
    mem_limit: 384m
    pids_limit: 256
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9997/v3/paths/list"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 8s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    # The hub is the only service that legitimately needs the full application
    # environment: it signs sessions (SESSION_SECRET), logs in (APP_*), talks to
    # the DVR (DVR_*/HIKVISION_*), sends Telegram media (TELEGRAM_*), runs face
    # detection and thumbnail settings, and owns the shared SQLite database.
    # Keeping `env_file` here means new hub settings are available without a
    # compose edit; no other container receives this file.
    env_file:
      - .env
    environment:
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_WHEP_URL: http://mediamtx:8889
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      OBJECT_DETECTION_STREAM: rtsp
      DATA_DIR: /app/data
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      # The only persistent application data. The host directory must be owned
      # by uid/gid 10001 (see docs/Container-Hardening.md).
      - ./data:/app/data
    # FFmpeg clip conversion and thumbnail extraction use the OS temp dir, and
    # Next.js may write cache files under .next/cache. Both are tmpfs so the
    # image itself can stay read-only. Sizes are upper bounds, not reservations.
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.next/cache:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # Next.js + FFmpeg + SQLite on a 4 GB host; 768m leaves room for MediaMTX
    # and the workers while still bounding a runaway FFmpeg or event loop.
    mem_limit: 768m
    pids_limit: 256
    # Give the node process time to finish in-flight requests and close SQLite.
    stop_grace_period: 30s
    depends_on:
      mediamtx:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Live object DETECTION worker. Part of the normal stack; it publishes no
  # ports and never touches the DVR directly.
  #
  # It reads the Admin's configuration from the shared SQLite database, samples
  # the H.264 substreams through MediaMTX over the compose network and writes one
  # object_detection_tracks row per tracked object. Detection itself is
  # controlled ONLY by Settings → Detection (SQLite); when it is off the process
  # keeps running idle and the container stays healthy.
  #
  # The YOLOX-Nano model lives in ./object-worker/models (kept out of git) and is
  # provisioned on the HOST before the container starts:
  #   npm run object:model        # or python3 object-worker/scripts/download_model.py
  # It is mounted read-only. The entrypoint verifies it and fails with an
  # actionable message when it is missing; nothing downloads in the container.
  object-worker:
    build:
      context: .
      dockerfile: object-worker/Dockerfile
    # Explicit, minimal environment: no SESSION_SECRET, no TELEGRAM_*, no APP_*,
    # no DVR_*/HIKVISION_* (the worker reaches MediaMTX, never the DVR). Only the
    # variables object-worker/config.py reads are passed. Empty values keep the
    # documented defaults in the code.
    environment:
      DATA_DIR: /app/data
      OBJECT_DETECTION_MODEL_PATH: /app/models/yolox_nano.onnx
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      OBJECT_DETECTION_STREAM: rtsp
      # Credential for MediaMTX's internal RTSP listener (never the DVR's).
      MEDIAMTX_AUTH_USER: "${MEDIAMTX_AUTH_USER:-}"
      MEDIAMTX_AUTH_PASSWORD: "${MEDIAMTX_AUTH_PASSWORD:-}"
      # Worker tuning from .env; empty means "use the code default".
      OBJECT_DETECTION_SETTINGS_POLL_MS: "${OBJECT_DETECTION_SETTINGS_POLL_MS:-}"
      OBJECT_DETECTION_HEARTBEAT_MS: "${OBJECT_DETECTION_HEARTBEAT_MS:-}"
      OBJECT_DETECTION_FRAME_STALE_MS: "${OBJECT_DETECTION_FRAME_STALE_MS:-}"
      OBJECT_DETECTION_RECONNECT_BACKOFF_MS: "${OBJECT_DETECTION_RECONNECT_BACKOFF_MS:-}"
      OBJECT_DETECTION_MAX_TRACKS_PER_CAMERA: "${OBJECT_DETECTION_MAX_TRACKS_PER_CAMERA:-}"
    volumes:
      - ./data:/app/data
      # Read-only: the model is provisioned on the host, never inside the
      # container. The host directory must be readable by uid/gid 10001.
      - ./object-worker/models:/app/models:ro
    # OpenCV/ONNX Runtime temp files go to /tmp; the rest of the image is
    # read-only. No persistent state lives outside ./data.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # Measured worker footprint is ~214 MB RAM; 1g allows for two-camera
    # inference peaks and OpenCV decode buffers without letting a model/parser
    # bug exhaust the 4 GB host. tmpfs pages count against this limit.
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    depends_on:
      mediamtx:
        condition: service_healthy
      # The hub owns the SQLite schema (and therefore the file the worker reads).
      # service_started is enough; the worker also retries/restarts if the
      # database is momentarily missing, so no fragile sleep is needed.
      web:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Healthy while the heartbeat is fresh, including detection disabled; only a
    # crashed/hung worker (or an explicit model error) is unhealthy.
    healthcheck:
      test: ["CMD", "python3", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Restart after a crash, Podman restart or server reboot; idle is not a crash.
    restart: unless-stopped

  # Local face DETECTION worker (optional, off by default).
  #
  # It is behind a compose profile so `podman compose up -d` does not start it
  # and FACE_DETECTION_ENABLED=false stays the default. To use it:
  #   1. python3 face-worker/scripts/download_model.py     # once, on the host
  #   2. FACE_DETECTION_ENABLED=true in .env
  #   3. podman compose --profile faces up -d face-worker
  #
  # It shares ./data with the web service, so it uses the same SQLite database
  # and the same face-crops directory. No separate database, no broker.
  face-worker:
    build:
      context: .
      dockerfile: face-worker/Dockerfile
    profiles: ["faces"]
    # Explicit, minimal environment: no SESSION_SECRET, no TELEGRAM_*, no APP_*,
    # no DVR_*/HIKVISION_*, and no MediaMTX credentials (this worker only reads
    # snapshots from the shared database). Only the variables
    # face-worker/config.py reads are passed; empty means "use the code default".
    environment:
      DATA_DIR: /app/data
      FACE_DETECTION_MODEL_PATH: /app/models/face_detection_yunet_2023mar.onnx
      FACE_DETECTION_ENABLED: "${FACE_DETECTION_ENABLED:-false}"
      FACE_DETECTION_CONFIDENCE: "${FACE_DETECTION_CONFIDENCE:-}"
      FACE_DETECTION_MAX_FACES: "${FACE_DETECTION_MAX_FACES:-}"
      FACE_DETECTION_POLL_INTERVAL_MS: "${FACE_DETECTION_POLL_INTERVAL_MS:-}"
      FACE_DETECTION_BACKFILL_DAYS: "${FACE_DETECTION_BACKFILL_DAYS:-}"
      FACE_DETECTION_MAX_ATTEMPTS: "${FACE_DETECTION_MAX_ATTEMPTS:-}"
      FACE_DETECTION_STALE_AFTER_S: "${FACE_DETECTION_STALE_AFTER_S:-}"
      FACE_DETECTION_BATCH_SIZE: "${FACE_DETECTION_BATCH_SIZE:-}"
      FACE_DETECTION_MAX_WIDTH: "${FACE_DETECTION_MAX_WIDTH:-}"
      FACE_DETECTION_JPEG_QUALITY: "${FACE_DETECTION_JPEG_QUALITY:-}"
    volumes:
      - ./data:/app/data
      - ./face-worker/models:/app/models:ro
    # OpenCV temp files go to /tmp; the rest of the image is read-only.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # YuNet is tiny; 1g is the same conservative bound as object-worker so the
    # optional profiles can never be the reason the 4 GB host runs out of RAM.
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    depends_on:
      web:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # It exits 0 immediately when detection is disabled, so a stray start is
    # harmless. A crash retries and then stops rather than looping forever.
    restart: on-failure
