# Home CCTV hub. Run with: podman compose up -d
# Podman on macOS runs containers in a Linux VM. Outbound traffic to the DVR
# is NATed through the Mac, which usually reaches the LAN. host network mode
# does not attach containers to the Mac's LAN, so it is not used here.
name: home-cctv

services:
  mediamtx:
    build:
      context: .
      dockerfile: mediamtx/Dockerfile
    env_file:
      - .env
    # Only the WebRTC media port is published in production.
    #
    # The browser talks to the hub for signalling (WHEP) and HLS, and the hub
    # reaches MediaMTX over the compose network. MediaMTX's HLS (8888), WHEP
    # (8889) and API (9997) listeners therefore stay internal. ICE media still
    # needs a reachable UDP/TCP endpoint, so 8189 is the one published port;
    # it only answers ICE for a WebRTC session that the authenticated hub has
    # already created. Never publish 554, 8888, 8889 or 9997 on the LAN.
    # For `npm run dev` on the host, compose.dev.yml adds loopback-only ports.
    ports:
      - "8189:8189/tcp"
      - "8189:8189/udp"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9997/v3/paths/list"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 8s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_WHEP_URL: http://mediamtx:8889
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      OBJECT_DETECTION_STREAM: rtsp
      DATA_DIR: /app/data
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    depends_on:
      mediamtx:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Live object DETECTION worker. Part of the normal stack; it publishes no
  # ports and never touches the DVR directly.
  #
  # It reads the Admin's configuration from the shared SQLite database, samples
  # the H.264 substreams through MediaMTX over the compose network and writes one
  # object_detection_tracks row per tracked object. Detection itself is
  # controlled ONLY by Settings → Detection (SQLite); when it is off the process
  # keeps running idle and the container stays healthy.
  #
  # The YOLOX-Nano model lives in ./object-worker/models (kept out of git). On
  # first start the entrypoint downloads it once if missing; an existing model is
  # verified and reused, so later starts need no network.
  object-worker:
    build:
      context: .
      dockerfile: object-worker/Dockerfile
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      OBJECT_DETECTION_MODEL_PATH: /app/models/yolox_nano.onnx
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      OBJECT_DETECTION_STREAM: rtsp
    volumes:
      - ./data:/app/data
      # Writable so the entrypoint can provision the model on a fresh install.
      - ./object-worker/models:/app/models
    depends_on:
      mediamtx:
        condition: service_healthy
      # The hub owns the SQLite schema (and therefore the file the worker reads).
      # service_started is enough; the worker also retries/restarts if the
      # database is momentarily missing, so no fragile sleep is needed.
      web:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Healthy while the heartbeat is fresh, including detection disabled; only a
    # crashed/hung worker (or an explicit model error) is unhealthy.
    healthcheck:
      test: ["CMD", "python3", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Restart after a crash, Podman restart or server reboot; idle is not a crash.
    restart: unless-stopped

  # Local face DETECTION worker (optional, off by default).
  #
  # It is behind a compose profile so `podman compose up -d` does not start it
  # and FACE_DETECTION_ENABLED=false stays the default. To use it:
  #   1. python3 face-worker/scripts/download_model.py     # once, on the host
  #   2. FACE_DETECTION_ENABLED=true in .env
  #   3. podman compose --profile faces up -d face-worker
  #
  # It shares ./data with the web service, so it uses the same SQLite database
  # and the same face-crops directory. No separate database, no broker.
  face-worker:
    build:
      context: .
      dockerfile: face-worker/Dockerfile
    profiles: ["faces"]
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      FACE_DETECTION_MODEL_PATH: /app/models/face_detection_yunet_2023mar.onnx
    volumes:
      - ./data:/app/data
      - ./face-worker/models:/app/models:ro
    depends_on:
      web:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # It exits 0 immediately when detection is disabled, so a stray start is
    # harmless. A crash retries and then stops rather than looping forever.
    restart: on-failure

