# Home CCTV hub. Run with: podman compose up -d
# Podman on macOS runs containers in a Linux VM. Outbound traffic to the DVR
# is NATed through the Mac, which usually reaches the LAN. host network mode
# does not attach containers to the Mac's LAN, so it is not used here.
name: home-cctv

services:
  mediamtx:
    build:
      context: .
      dockerfile: mediamtx/Dockerfile
    env_file:
      - .env
    # Only the WebRTC media port is published in production.
    #
    # The browser talks to the hub for signalling (WHEP) and HLS, and the hub
    # reaches MediaMTX over the compose network. MediaMTX's HLS (8888), WHEP
    # (8889) and API (9997) listeners therefore stay internal. ICE media still
    # needs a reachable UDP/TCP endpoint, so 8189 is the one published port;
    # it only answers ICE for a WebRTC session that the authenticated hub has
    # already created. Never publish 554, 8888, 8889 or 9997 on the LAN.
    # For `npm run dev` on the host, compose.dev.yml adds loopback-only ports.
    ports:
      - "8189:8189/tcp"
      - "8189:8189/udp"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9997/v3/paths/list"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 8s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_WHEP_URL: http://mediamtx:8889
      MEDIAMTX_HLS_URL: http://mediamtx:8888
      DATA_DIR: /app/data
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    depends_on:
      mediamtx:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Local face DETECTION worker (optional, off by default).
  #
  # It is behind a compose profile so `podman compose up -d` does not start it
  # and FACE_DETECTION_ENABLED=false stays the default. To use it:
  #   1. python3 face-worker/scripts/download_model.py     # once, on the host
  #   2. FACE_DETECTION_ENABLED=true in .env
  #   3. podman compose --profile faces up -d face-worker
  #
  # It shares ./data with the web service, so it uses the same SQLite database
  # and the same face-crops directory. No separate database, no broker.
  face-worker:
    build:
      context: .
      dockerfile: face-worker/Dockerfile
    profiles: ["faces"]
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      FACE_DETECTION_MODEL_PATH: /app/models/face_detection_yunet_2023mar.onnx
    volumes:
      - ./data:/app/data
      - ./face-worker/models:/app/models:ro
    depends_on:
      web:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # It exits 0 immediately when detection is disabled, so a stray start is
    # harmless. A crash retries and then stops rather than looping forever.
    restart: on-failure

